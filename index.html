<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>SMART POINT - Modul 3</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header class="header">
    <img src="assets/logo.png" class="logo" alt="Logo">
    <h1>SMART POINT</h1>
    <h2>Sistem Manajemen Laporan Pelanggaran & Prestasi Siswa</h2>
    <p>SMA Negeri 15 Surabaya</p>
  </header>

  <section class="card">
    <h3>Identitas Guru</h3>
    <div class="form-group">
      <label>Nama Guru Pelapor</label>
      <input id="guru" type="text" placeholder="Masukkan nama guru">
    </div>
  </section>

  <section class="card">
    <h3>Pilih Jenis Laporan</h3>
    <div class="menu-container">
      <button id="btnPelanggaran" class="menu-button danger active">⚠️ Pelanggaran</button>
      <button id="btnPrestasi" class="menu-button success">🏆 Prestasi</button>
    </div>
  </section>

  <section id="formContainer" class="card">
    <h3 id="judulForm">Form Laporan Pelanggaran</h3>

    <div class="form-group">
      <label>Kelas</label>
      <select id="kelas"></select>
    </div>

    <div class="form-group">
      <label>Nama Siswa</label>
      <select id="nama_siswa"></select>
    </div>

    <div class="form-group">
      <label>NIS</label>
      <input id="nis" readonly>
    </div>

    <div class="form-group">
      <label>Nomor WA Orang Tua</label>
      <input id="nomor_wa" readonly>
    </div>

    <hr>

    <div id="pelanggaranSection">
      <div class="form-group">
        <label>Nama Pelanggaran</label>
        <select id="nama_pelanggaran">
          <option value="">Memuat data...</option>
        </select>
      </div>

      <div class="form-group">
        <label>Jumlah Poin</label>
        <input id="jumlah_poin" readonly>
      </div>

      <div class="form-group">
        <label>Pembinaan</label>
        <textarea id="pembinaan" rows="5"
          placeholder="Tuliskan bentuk pembinaan yang diberikan..."></textarea>
      </div>

      <div class="form-group">
        <label>Foto Pembinaan</label>
        <input id="foto" type="file" accept="image/*" capture="environment">
      </div>

      <div class="form-group">
        <img id="previewFoto" style="display:none;max-width:100%;border-radius:12px;">
      </div>

      <button id="btnLaporkan" disabled>LAPORKAN</button>
    </div>

    <div id="prestasiSection" style="display:none"></div>
  </section>

  <script src="js/config.js"></script>
  <script src="js/siswa.js"></script>
  <script src="js/pelanggaran.js"></script>
  <script src="js/prestasi.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/app.js"></script>
</div>
<!-- ===============================
     POPUP BERHASIL
================================ -->

<div id="popupBerhasil" class="popup">

    <div class="popup-content">

        <div class="popup-icon">
            ✅
        </div>

        <h2>Laporan Berhasil</h2>

        <p>
            Data berhasil disimpan.
        </p>

        <button id="btnWA" class="btn-wa">
            📱 Kirim WA Orang Tua
        </button>

        <button id="btnInputLagi" class="btn-input">
            ➕ Input Laporan Baru
        </button>

    </div>

</div>
</body>
</html>
