<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>LIBELS SMART POINT</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div class="container">
  <header class="hero">

    <div class="hero-overlay">

        <img
            src="assets/logo.png"
            class="hero-logo"
            alt="Logo SMA Negeri 15 Surabaya">

        <h1>SMART POINT</h1>

        <h2>
            Sistem Manajemen Laporan Pelanggaran & Prestasi Siswa
        </h2>

        <p>
            SMA Negeri 15 Surabaya
        </p>

    </div>

</header>

<div class="top-section">

  <section class="card">
    <h3>Identitas Guru</h3>
    <div class="form-group">
      <label>Nama Guru Pelapor</label>
      <input id="guru" type="text" placeholder="Masukkan nama guru">
    </div>
  </section>

  <section class="card">
    <h3>Pilih Jenis Laporan</h3>
    <div class="menu-container">
      <button id="btnPelanggaran"
        class="menu-button danger">

    <i data-lucide="triangle-alert"></i>

    <span>Pelanggaran</span>

</button>

<button id="btnPrestasi" class="menu-button success">

    <i data-lucide="trophy"></i>

    <span>Prestasi</span>

</button>
    </div>
  </section>

</div>

  <section id="formContainer" class="card">
    <h3 id="judulForm">

    <i data-lucide="triangle-alert"></i>

    Form Laporan Pelanggaran

</h3>

    <div class="form-group">
      <label>Kelas</label>
      <select id="kelas"></select>
    </div>

    <div class="form-group">
      <label>Nama Siswa</label>
      <select id="nama_siswa"></select>
    </div>

    <div class="form-group">
      <label>NIS</label>
      <input id="nis" readonly>
    </div>

    <div class="form-group">
      <label>Nomor WA Orang Tua</label>
      <input id="nomor_wa" readonly>
    </div>

    <hr>

    <div id="pelanggaranSection">
      <div class="form-group">
        <label>Nama Pelanggaran</label>

<div class="autocomplete">

    <input
        id="nama_pelanggaran"
        type="text"
        placeholder="🔍 Ketik nama pelanggaran...">

    <div
        id="pelanggaranList"
        class="autocomplete-list">
    </div>

</div>

      <div class="form-group">
        <label>Jumlah Poin</label>
        <input id="jumlah_poin" readonly>
      </div>

      <div class="form-group">
        <label>Pembinaan</label>
        <textarea id="pembinaan" rows="5"
          placeholder="Tuliskan bentuk pembinaan yang diberikan..."></textarea>
      </div>

      <div class="form-group">
        <label>Foto Pembinaan</label>
        <input id="foto" type="file" accept="image/*">
      </div>

      <div class="form-group">
        <img id="previewFoto" style="display:none;max-width:100%;border-radius:12px;">
      </div>

      <button id="btnLaporkan" disabled>LAPORKAN</button>
    </div>

    <div id="prestasiSection" style="display:none">

    <div class="form-group">
        <label>Nama Penghargaan</label>
        <input
            type="text"
            id="nama_penghargaan"
            placeholder="Contoh : Juara 1 Lomba PAI Tingkat Kota">
    </div>

    <div class="form-group">
        <label>Kategori</label>
        <select id="kategori">
            <option value="">Memuat data...</option>
        </select>
    </div>

    <div class="form-group">
        <label>Masa Berlaku</label>
        <input
            id="masa_berlaku"
            type="text"
            readonly>
    </div>

    <div class="form-group">
        <label>Tingkat Penghargaan</label>
        <select id="tingkat_penghargaan">
            <option value="">Pilih kategori terlebih dahulu</option>
        </select>
    </div>

    <div class="form-group">
        <label>Jumlah Poin</label>
        <input
            id="jumlah_poin_prestasi"
            type="text"
            readonly>
    </div>

    <div class="form-group">
        <label>Foto Prestasi</label>
        <input
            id="foto_prestasi"
            type="file"
            accept="image/*"
            capture="environment">
    </div>

    <div class="form-group">
        <img
            id="previewFotoPrestasi"
            style="display:none;max-width:100%;border-radius:12px;">
    </div>

    <button id="btnLaporkanPrestasi" disabled>
        🏆 LAPORKAN PRESTASI
    </button>

</div>

  <script src="https://unpkg.com/lucide@latest"></script>
  <script src="js/config.js"></script>
  <script src="js/siswa.js"></script>
  <script src="js/pelanggaran.js"></script>
  <script src="js/prestasi.js"></script>
  <script src="js/whatsapp.js"></script>
  <script src="js/app.js"></script>
</div>
<!-- ===============================
     POPUP BERHASIL
================================ -->

<div id="popupBerhasil" class="popup">

    <div class="popup-content">

        <div class="popup-icon">
            ✅
        </div>

        <h2>Laporan Berhasil</h2>

        <p>
            Data berhasil disimpan.
        </p>

        <button id="btnWA" class="btn-wa">
            📱 Kirim WA Orang Tua
        </button>

    </div>

</div>

<!-- ===============================
     LOADING UPLOAD
================================ -->

<div id="loadingOverlay" class="loading-overlay" style="display:none;">

    <div class="loading-box">

        <div class="loader"></div>

        <h3>Mengirim Laporan...</h3>

        <p>
            Mohon tunggu beberapa saat.<br>
            Foto sedang diunggah dan data sedang disimpan.
        </p>

    </div>

</div>

<script>
lucide.createIcons();
</script>
</body>
</html>
